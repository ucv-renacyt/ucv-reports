<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Visualiza tus Reportes</title>
  <link rel="stylesheet" href="../../CSS/reportes_ver/reportes_ver.css" />
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <link rel="icon" type="image/svg+xml" href="/CSS/auth/images/logo-reportes.svg">
</head>

<body>
  <div class="dashboard-container">
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
      <div class="logo-section">
        <div class="logo"><img src="/CSS/auth/images/logo-reportes.svg" alt="Logo de Reportes" width="48" height="48"></div>
        <div class="logo-text">Sistema<br>Reportes</div>
      </div>

      <div class="nav-menu">
        <a href="#" class="nav-item">
          <span>Enviar Reporte</span>
        </a>
        <a href="#" class="nav-item active">
          <span>Artículos Reportados</span>
        </a>
        <a href="#" class="nav-item">
          <span>Salir</span>
        </a>
      </div>
    </nav>

    <!-- Overlay for mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
      <header class="header">
        <h1>
          <span>Visualiza tus Reportes</span>
        </h1>
        <button class="hamburger" id="hamburgerBtn" onclick="toggleSidebar()">X</button>
      </header>


      <div class="content-area">
        <div class="help-banner">
          <div class="help-content">
            <div class="help-text">
              <strong>Ayuda:</strong> Aquí puedes observar y revisar tus
              reportes enviados. Si no logras visualizarlo actualiza la
              página.
            </div>
            <button class="help-btn" onclick="irHistorial()">
              Historial
            </button>
          </div>
        </div>

        <!-- Reports Table Container -->
        <div class="table-container">
          <div class="table-header">
            <h2>Lista de Reportes</h2>
          </div>

          <!-- Desktop Table -->
          <div class="desktop-table">
            <table class="reports-table">
              <thead>
                <tr>
                  <th>Fecha</th>
                  <th>
                    Lugar del Reporte
                  </th>
                  <th>Descripción</th>
                  <th>Motivo</th>
                  <th>Acción</th>
                </tr>
              </thead>
              <tbody id="reportes-table-body"></tbody>
            </table>
          </div>

          <!-- Mobile Cards -->
          <div class="mobile-cards" id="reportes-mobile-cards"></div>
        </div>
      </div>
    </main>
  </div>
  <script src="../../JAVASCRIPT/reportes_globlaes.js"></script>
</body>

</html>
