<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reportes Globales</title>
  <link rel="stylesheet" href="../../CSS/reportes_globales/reportes_globales.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body>
  <div class="container">
    <aside class="sidebar" id="sidebar">
      <div class="logo-section">
        <span class="logo-text">Sistema Reportes</span>
      </div>
      <nav class="nav-menu">
        <a href="/reporte_enviar" class="nav-item">
          <span>Enviar Reporte</span>
        </a>
        <a href="/reportes_globales" class="nav-item active">
          <span>Artículos Reportados</span>
        </a>
        <a href="/" class="nav-item">
          <span>Salir</span>
        </a>
      </nav>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="main-content" id="mainContent">
      <header class="header">
        <div class="header-title">
          <span>Reportes Globales</span>
        </div>
        <button class="hamburger" id="hamburgerBtn" onclick="toggleSidebar()">
          X
        </button>
      </header>

      <div class="reports-grid" id="reportsGrid">
      </div>

      <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
          <div class="modal-header">
            <h2 class="modal-title">
              Detalles del Reporte
            </h2>
            <button class="close-btn" onclick="closeModal()">
              X
            </button>
          </div>
          <div class="modal-content">
            <div class="modal-info">
              <div class="info-item">
                <span class="info-label">
                  Facultad:
                </span>
                <span class="info-value" id="modalFacultad"></span>
              </div>
              <div class="info-item">
                <span class="info-label">
                  Turno:
                </span>
                <span class="info-value" id="modalTurno"></span>
              </div>
              <div class="info-item">
                <span class="info-label">
                  Fecha:
                </span>
                <span class="info-value" id="modalFecha"></span>
              </div>
              <div class="info-item">
                <span class="info-label">
                  Estado:
                </span>
                <span class="info-value" id="modalEstado"></span>
              </div>
              <div class="info-item">
                <span class="info-label">
                  Lugar del Problema:
                </span>
                <span class="info-value" id="modalLugar"></span>
              </div>
              <div class="info-item">
                <span class="info-label">
                  Descripción del Problema:
                </span>
                <span class="info-value" id="modalDescripcion"></span>
              </div>
            </div>
            <div class="evidence-section">
              <h3 class="evidence-title">
                Evidencia:
              </h3>
              <img src="" alt=" Evidencia del problema" class="evidence-image" id="modalEvidencia"
                style="display: none" />
            </div>
          </div>
        </div>
      </div>

      <script type="module" src="../../JAVASCRIPT/usuario_reportes_globales.js"></script>
</body>

</html>
